[project]
name = "ankihelper"
version = "0.1.0"
description = "Backend API for the AnkiHelper Anki add-on: review stats and shared groups."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.0",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.14.0",
    "supabase>=2.32.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
